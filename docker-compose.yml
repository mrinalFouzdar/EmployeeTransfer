services:
  postgres:
    image: postgres:16
    container_name: employee_portal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: employee_portal
      POSTGRES_PASSWORD: employee_portal_dev
      POSTGRES_DB: employee_portal
    ports:
      - "5434:5432"
    volumes:
      - employee_portal_pgdata:/var/lib/postgresql/data

volumes:
  employee_portal_pgdata:
